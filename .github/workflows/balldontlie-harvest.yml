# Pulls everything scripts/balldontlie_harvest.py's PLAN asks for from
# BALLDONTLIE's ALL-ACCESS trial (bought 2026-09-15, ~48 hours -- see the
# harvester's own module docstring for the full brief and what each sport's
# plan covers) and uploads the compressed JSONL it writes to a GitHub
# release. data/historical/* is git-ignored (.gitignore's "Generated data"
# block does not list balldontlie/ among its negations), and these files
# are far too large and numerous to commit directly, so a release is the
# archive instead. Only MANIFEST.json and any in-progress `.cursor`
# sidecars are committed -- small, and exactly what a later run (this
# workflow again, or scripts/balldontlie_harvest.py by hand) needs to know
# what is already done and where a partial job left off.
#
# workflow_dispatch only: this drains a one-time trial, it is not a
# recurring job, so there is deliberately no cron trigger.
name: balldontlie-harvest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "harvest (full run) or probe (one cheap per-sport request to check rate-limit state)"
        type: choice
        options:
          - harvest
          - probe
        default: harvest
      sports:
        description: "Comma-separated sports to harvest"
        default: "tennis,nfl,mlb,nba,nhl"
      max_minutes:
        description: "Stop cleanly after this many minutes, leaving resumable state"
        default: "330"
      release_tag:
        description: "GitHub release to upload the harvested files to"
        default: "balldontlie-harvest-2026-09"

concurrency:
  group: balldontlie-harvest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    # Comfortably above max_minutes' default (330) so the harvester's own
    # clean stop -- not the runner's hard kill -- is what ends a normal run.
    timeout-minutes: 350
    steps:
      # This branch, not the repo's orphan default branch -- see
      # docs/CAPTURE_EXTERNALIZATION.md's "Default-branch constraint" for
      # why every other data-writing workflow in this repo names it
      # explicitly the same way.
      - uses: actions/checkout@v4
        with:
          ref: claude/sports-betting-analysis-review-g1o0co
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git identity for the commit this run may make
        run: |
          git config user.name "balldontlie-harvest-bot"
          git config user.email "balldontlie-harvest-bot@users.noreply.github.com"

      # Chained runs never commit data/historical/* (it's git-ignored --
      # only MANIFEST.json and .cursor sidecars are). Without this step a
      # resumed job opens a FRESH .jsonl.gz, re-pages from its cursor, and
      # the upload step's --clobber below overwrites the release's longer
      # asset with that shorter restart -- wasting every request already
      # paid for and destroying data (root cause C). Release assets are
      # flat (no sport subdirectory), so restoring them needs the same
      # basename -> sport mapping the harvester's own out_name convention
      # implies; MANIFEST.json (already checked out) has it exactly, with
      # a filename-prefix fallback for anything the manifest doesn't know.
      # A copy of the PRE-run manifest is also stashed here for the upload
      # step's own no-clobber-with-a-shorter-file check further below.
      - name: Restore previously-harvested files from the release
        if: ${{ inputs.mode == 'harvest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/bdl_restore
          gh release download "${{ inputs.release_tag }}" --dir /tmp/bdl_restore --pattern '*.jsonl.gz' --clobber \
            || echo "no release '${{ inputs.release_tag }}' yet (or nothing to download) -- starting clean"
          cp data/historical/balldontlie/MANIFEST.json /tmp/bdl_manifest_prerun.json 2>/dev/null \
            || echo '{}' > /tmp/bdl_manifest_prerun.json
          python3 - /tmp/bdl_restore data/historical/balldontlie <<'PY'
          import json, shutil, sys
          from pathlib import Path

          restore_dir, out_dir = Path(sys.argv[1]), Path(sys.argv[2])
          manifest_path = out_dir / "MANIFEST.json"

          basename_to_sport = {}
          if manifest_path.exists():
              try:
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError):
                  manifest = {}
              for entry in manifest.values():
                  file_rel, sport = entry.get("file"), entry.get("sport")
                  if file_rel and sport:
                      basename_to_sport[Path(file_rel).name] = sport

          PREFIX_TO_SPORT = {
              "atp_": "tennis", "wta_": "tennis",
              "nfl_": "nfl", "mlb_": "mlb", "nba_": "nba", "nhl_": "nhl",
          }

          for asset in sorted(restore_dir.glob("*.jsonl.gz")):
              sport = basename_to_sport.get(asset.name)
              if sport is None:
                  sport = next((v for k, v in PREFIX_TO_SPORT.items() if asset.name.startswith(k)), None)
              if sport is None:
                  print(f"skip {asset.name}: cannot determine its sport subdirectory")
                  continue
              dest_dir = out_dir / sport
              dest_dir.mkdir(parents=True, exist_ok=True)
              dest = dest_dir / asset.name
              shutil.move(str(asset), str(dest))
              print(f"restored {dest}")
          PY

      - name: Run the harvester (harvest mode)
        if: ${{ inputs.mode == 'harvest' }}
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          python scripts/balldontlie_harvest.py \
            --sports "${{ inputs.sports }}" \
            --max-minutes "${{ inputs.max_minutes }}"

      - name: Run the harvester (probe mode)
        if: ${{ inputs.mode == 'probe' }}
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          python scripts/balldontlie_harvest.py \
            --probe \
            --sports "${{ inputs.sports }}"

      - name: Ensure the release exists
        if: ${{ inputs.mode == 'harvest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.release_tag }}" \
              --title "${{ inputs.release_tag }}" \
              --notes "BALLDONTLIE ALL-ACCESS harvest"

      # Second belt for root cause C: even with the restore step above, never
      # let --clobber replace a release asset with a file SHORTER than what
      # the PRE-run manifest (stashed by the restore step, before this run's
      # own writes) recorded for it -- that would only be possible if a file
      # somehow went backwards, and clobbering data away from under a live
      # trial is worse than skipping one upload and leaving it for the next
      # run to sort out.
      - name: Upload harvested files to the release
        if: ${{ inputs.mode == 'harvest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(data/historical/balldontlie/**/*.jsonl.gz)
          mapfile -t to_upload < <(python3 - "${files[@]}" <<'PY'
          import json, os, sys

          try:
              manifest = json.load(open("/tmp/bdl_manifest_prerun.json", encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              manifest = {}
          base = "data/historical/balldontlie/"
          for path in sys.argv[1:]:
              rel = path[len(base):] if path.startswith(base) else path
              prev_bytes = (manifest.get(rel) or {}).get("bytes") or 0
              cur_bytes = os.path.getsize(path)
              if cur_bytes < prev_bytes:
                  print(f"SKIP {path}: {cur_bytes} bytes < {prev_bytes} bytes already on the "
                        "release -- would clobber a longer asset with a shorter file", file=sys.stderr)
              else:
                  print(path)
          PY
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .jsonl.gz files produced this run -- nothing to upload"
          elif [ ${#to_upload[@]} -eq 0 ]; then
            echo "every candidate file would shrink its release asset -- nothing safe to upload"
          else
            echo "uploading ${#to_upload[@]} file(s) to release ${{ inputs.release_tag }}"
            gh release upload "${{ inputs.release_tag }}" "${to_upload[@]}" --clobber
          fi

      # -f on both `git add` calls: see the header comment above --
      # data/historical/* is ignored and balldontlie/ is not negated back
      # in, so a plain `git add` here would silently stage nothing and
      # every run would look like it starts from zero.
      - name: Commit the manifest and any resumable cursor state
        if: ${{ inputs.mode == 'harvest' }}
        run: |
          set -uo pipefail
          git add -f data/historical/balldontlie/MANIFEST.json 2>/dev/null || true
          find data/historical/balldontlie -name '*.cursor' -print0 2>/dev/null \
            | xargs -0 -r git add -f

          if git diff --cached --quiet; then
            echo "== no manifest/cursor changes =="
            exit 0
          fi

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if ! git commit -q -m "balldontlie harvest: $(date -u +%Y-%m-%dT%H:%MZ)"; then
            echo "::error::git commit failed"
            exit 1
          elif ! git fetch -q origin "$BRANCH"; then
            echo "::error::git fetch failed -- commit is local only"
            exit 1
          elif ! git pull -q --rebase --autostash origin "$BRANCH"; then
            git rebase --abort 2>/dev/null || true
            echo "::error::rebase onto origin/$BRANCH failed -- commit is local only, needs manual resolution"
            exit 1
          fi

          # Same retry shape as scripts/capture_slot.sh's push block: three
          # tries with a short growing backoff for a push that lost a race
          # against another writer.
          PUSH_OK=0
          for delay in 0 2 4; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            if git push -q origin "$BRANCH"; then
              PUSH_OK=1
              break
            fi
          done
          if [ "$PUSH_OK" -eq 1 ]; then
            echo "== committed =="
          else
            echo "::error::push failed after retries -- commit is local only, needs manual push"
            exit 1
          fi
