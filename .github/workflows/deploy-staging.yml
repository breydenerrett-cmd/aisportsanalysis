# Deploys linehound-staging on every push to the launch branch, and on
# manual dispatch. Requires ONE repository secret: FLY_API_TOKEN (the
# app-scoped deploy token for linehound-staging). Without the secret the
# job fails fast at the guard step -- it never half-deploys.
#
# Why Actions and not the session container: the container's egress proxy
# breaks the depot builder's TLS handshake, and app-scoped tokens are not
# authorized for the classic remote builder. GitHub's runners have clean
# egress, so this is the repeatable path.
name: deploy-staging

on:
  push:
    branches: [claude/sports-betting-analysis-review-g1o0co]
    paths:
      - "api/**"
      - "src/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/deploy-staging.yml"
      # forward-capture commits refresh the stores baked into the image, so
      # staging's Today/Odds data follows the hourly captures automatically
      # (concurrency group serializes; volume-backed app db is unaffected).
      - "data/processed/**"
      - "data/watch/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - secret present
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "FLY_API_TOKEN repository secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      # F-2: the historical stores are git-ignored and live only in the
      # daily-loop cache. Restore the newest one so deploy/Dockerfile can
      # COPY them into the image; the matchup page reads them for team
      # records, starter form, bullpen and lineups. The key never matches
      # (it carries this run's id) so restore-keys always resolves to the
      # newest daily-loop save. A miss is not fatal: the image builds with
      # an empty data/historical/ and the API states each gap.
      - name: Restore historical stores from the daily-loop cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/historical/statcast
            data/historical/mlb_results.csv
            data/historical/mlb_results.manifest.json
            data/historical/pitcher_logs.jsonl
            data/historical/bullpen_log.jsonl
            data/historical/lineups.jsonl
            data/historical/handedness.json
          key: daily-loop-data-${{ github.run_id }}
          restore-keys: |
            daily-loop-data-
      - name: Report which stores the image will carry
        run: ls -la data/historical/ || true
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy -c deploy/fly.staging.toml -a linehound-staging --remote-only --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://linehound-staging.fly.dev/health >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "health check did not pass within 2 minutes"; exit 1
