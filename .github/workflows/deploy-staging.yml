# Deploys linehound-staging on every push to the launch branch, and on
# manual dispatch. Requires ONE repository secret: FLY_API_TOKEN (the
# app-scoped deploy token for linehound-staging). Without the secret the
# job fails fast at the guard step -- it never half-deploys.
#
# Why Actions and not the session container: the container's egress proxy
# breaks the depot builder's TLS handshake, and app-scoped tokens are not
# authorized for the classic remote builder. GitHub's runners have clean
# egress, so this is the repeatable path.
name: deploy-staging

on:
  push:
    branches: [claude/sports-betting-analysis-review-g1o0co]
    paths:
      - "api/**"
      - "src/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/deploy-staging.yml"
      # forward-capture commits refresh the stores baked into the image, so
      # staging's Today/Odds data follows the hourly captures automatically
      # (concurrency group serializes; volume-backed app db is unaffected).
      - "data/processed/**"
      - "data/watch/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - secret present
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "FLY_API_TOKEN repository secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      # F-2: the historical stores are git-ignored and live only in the
      # daily-loop cache. Restore the newest one so deploy/Dockerfile can
      # COPY them into the image; the matchup page reads them for team
      # records, starter form, bullpen and lineups. The key never matches
      # (it carries this run's id) so restore-keys always resolves to the
      # newest daily-loop save. A miss is not fatal: the image builds with
      # an empty data/historical/ and the API states each gap.
      # THIS PATH LIST MUST MATCH daily-loop.yml's SAVE STEP EXACTLY --
      # same entries, same order. It is not a list of "files we would like";
      # it is half of the cache's identity.
      #
      # GitHub derives a cache VERSION by hashing the `path` input, and a
      # restore only matches when BOTH the key and that version agree. A key
      # that matches with a different path list reports, in full,
      # "Cache not found" -- indistinguishable from no cache existing.
      #
      # It said exactly that on every staging deploy up to 2026-09-10, while
      # 45 MiB caches with that very prefix were being written every thirty
      # minutes. Two differences were enough: this list asked for a
      # `transactions.jsonl` that daily-loop never saves, and it put
      # `standings.jsonl` in a different position.
      #
      # The consequence was not a failed deploy. A cache miss is not an
      # error, so every deploy went green and shipped an image whose
      # data/historical/ held one empty .gitkeep. The app then had no results
      # store, no lineups and no bullpen log, fell back to live provider
      # calls on a single shared CPU, and stopped answering -- which is what
      # the owner saw as "LOADING THE SLATE" spinning on his phone for
      # minutes on 2026-09-10.
      #
      # If a store is genuinely needed here, ADD IT TO daily-loop's save step
      # first and then to this list. Adding it only here silently breaks
      # every restore, which is the failure this comment exists to prevent.
      - name: Restore historical stores from the daily-loop cache
        id: restore_stores
        uses: actions/cache/restore@v4
        with:
          path: |
            data/historical/statcast
            data/historical/mlb_results.csv
            data/historical/mlb_results.manifest.json
            data/historical/pitcher_logs.jsonl
            data/historical/bullpen_log.jsonl
            data/historical/lineups.jsonl
            data/historical/handedness.json
            data/historical/matchup_history.jsonl
            data/historical/matchup_pairs.json
            data/historical/pitcher_splits.json
            data/historical/arsenals
            data/historical/standings.jsonl
          key: daily-loop-data-${{ github.run_id }}
          restore-keys: |
            daily-loop-data-
      - name: Report which stores the image will carry
        run: ls -la data/historical/ || true

      # A DEPLOY THAT SHIPS NO DATA MUST BE LOUD. It is not, by itself, a
      # reason to refuse.
      #
      # This step first failed the build outright, and that was calibrated
      # too strong. The reasoning was that an image with no results store
      # must be what made the slate pages hang for the owner on 2026-09-10.
      # It was then MEASURED instead of assumed: building the same slate with
      # the results store empty takes 0.81s against 0.86s with 4,581 rows
      # loaded -- marginally FASTER, because there is less to read. The
      # missing data degrades what the page can say; it is not what made it
      # hang, and deploy/Dockerfile says as much where it COPYs the stores.
      #
      # Failing here therefore blocked every deploy -- including fixes for
      # the far worse problem -- over a defect that is real but separate.
      # So: annotate loudly, record the cause, and let the deploy through.
      #
      # WHY IT NEVER RESTORES. The caches exist (45 MiB, written every 30
      # minutes) but they live on refs/heads/claude/cowork-session-migration
      # -tn3sx2, and a run on the working branch reports zero caches visible.
      # That branch is an ORPHAN default branch -- it shares no history with
      # the working branch -- so the working branch never inherits its cache
      # scope. Matching the `path` list to daily-loop's save step (done
      # above, and necessary in its own right) did not fix it.
      #
      # The durable fix is to stop crossing branches for this: publish the
      # stores as a workflow ARTIFACT, which is repo-scoped rather than
      # branch-scoped. That requires editing daily-loop.yml ON THE DEFAULT
      # BRANCH, since cron workflows run from there, and is not something
      # this branch can do to itself.
      - name: Warn if the image is shipping with no data
        run: |
          set -eu
          results="data/historical/mlb_results.csv"
          if [ ! -s "$results" ]; then
            echo "::warning::$results is missing -- the daily-loop cache did"
            echo "::warning::not restore, so this image ships with no results"
            echo "::warning::store. The matchup page will state the gap rather"
            echo "::warning::than show records. See this step's comment."
            echo "Caches that exist right now:"
            gh cache list --limit 3 || true
            echo "Visible to THIS ref (expect 0 -- that is the bug):"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/caches?ref=${GITHUB_REF}" \
              --jq '.total_count' || true
          else
            echo "results store: $(wc -l < "$results") rows -- shipping"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy -c deploy/fly.staging.toml -a linehound-staging --remote-only --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # TWO PHASES, AND THE SECOND ONE EXISTS BECAUSE OF 2026-09-10.
      #
      # This step used to exit 0 on the first successful /health and stop.
      # That day a deploy passed it and the app was returning 503 within the
      # hour: /health touches no store, and the card endpoint was parsing a
      # 38 MB odds file per request on a 512 MB machine. Nothing broke until
      # a person opened the page, by which time the workflow was long green.
      #
      # Phase 1 waits for the app to come up. Phase 2 then EXERCISES THE
      # PAGE PATH -- a request that actually builds a card -- and keeps
      # checking health for a further minute, so a container that dies under
      # its first real request fails the deploy that shipped it.
      - name: Health check
        run: |
          set -u
          BASE=https://linehound-staging.fly.dev
          up=0
          for i in $(seq 1 12); do
            if curl -sf "$BASE/health" >/dev/null; then up=1; break; fi
            sleep 10
          done
          if [ "$up" -ne 1 ]; then
            echo "health check did not pass within 2 minutes"; exit 1
          fi
          echo "up; now exercising the page path"

          # The card route is behind the paid gate, so 401 is the SUCCESS
          # case here -- it proves the route is mounted and the app answered.
          # What must not happen is a 5xx or a dropped connection, which is
          # what an out-of-memory container produces.
          # /games AND /changed ARE IN THIS LIST BECAUSE THEY WERE NOT.
          #
          # On the evening of 2026-09-10 the owner watched "LOADING THE
          # SLATE" spin on his phone while this very check was green. The
          # four paths below it were all answering; /games/{date} was
          # hanging past 34 seconds, and /changed/{date} with it. Nothing
          # exercised either, so a completely dead Games page shipped as a
          # successful deploy.
          #
          # The rule the omission broke: a deploy check must touch every
          # route a customer's first screen calls. #/today alone fires
          # /today, /games/{date}, /odds/{date} and /changed/{date}.
          # BOTH DATES, AND THE EASTERN ONE IS THE ONE THAT MATTERS.
          #
          # This used `date -u` only. The app's slate date is EASTERN
          # (snapshots.official_date, and the page header reads "THU SEP 10 ·
          # 9:00pm ET"), so for the four or five hours a day when the two
          # disagree, the check warmed a cache key no visitor ever asks for.
          #
          # That is not cosmetic. Every one of these requests leaves its date
          # cached, so the check doubles as the cache warmer that spares the
          # first real visitor a cold rebuild -- and on the evening of
          # 2026-09-10 it warmed 09-11 while the page asked for 09-10 and got
          # a 503. Warming the wrong key is the same as not warming at all.
          #
          # Late evening ET also rolls the page to the NEXT slate, so both
          # dates are genuinely wanted; the duplicate when they agree costs a
          # cache hit.
          ET=$(TZ=America/New_York date +%Y-%m-%d)
          UTC=$(date -u +%Y-%m-%d)
          DATES="$ET"
          [ "$UTC" != "$ET" ] && DATES="$ET $UTC"
          paths="/card/record /today"
          for d in $DATES; do
            paths="$paths /card/$d /opportunities/$d /games/$d /changed/$d /odds/$d"
          done
          for path in $paths; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$BASE$path" || echo 000)
            echo "  $path -> $code"
            case "$code" in
              5*|000) echo "ESCALATE: $path returned $code -- the deploy is up but cannot serve a page"; exit 1 ;;
            esac
          done

          # Still alive a minute after doing real work?
          for i in $(seq 1 6); do
            sleep 10
            if ! curl -sf "$BASE/health" >/dev/null; then
              echo "ESCALATE: the app answered a page request and then stopped responding -- almost certainly out of memory"
              exit 1
            fi
          done
          echo "healthy, and still healthy after serving real requests"

      # THE LOGS, WHEN IT GOES WRONG. Without this, a failing health check
      # reports only the status code a customer would have seen, and the one
      # place that knows WHY -- the container's own stderr -- is unreadable
      # from a laptop because FLY_API_TOKEN is an Actions secret and stays
      # one. Diagnosing /games/{date} hanging on 2026-09-10 meant probing the
      # live app from a browser and reasoning backwards; these lines would
      # have said it outright.
      - name: Container logs (only when the check failed)
        if: failure()
        run: flyctl logs -a linehound-staging --no-tail | tail -120
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
