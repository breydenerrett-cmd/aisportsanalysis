# Deploys linehound-staging on every push to the launch branch, and on
# manual dispatch. Requires ONE repository secret: FLY_API_TOKEN (the
# app-scoped deploy token for linehound-staging). Without the secret the
# job fails fast at the guard step -- it never half-deploys.
#
# Why Actions and not the session container: the container's egress proxy
# breaks the depot builder's TLS handshake, and app-scoped tokens are not
# authorized for the classic remote builder. GitHub's runners have clean
# egress, so this is the repeatable path.
name: deploy-staging

on:
  push:
    branches: [claude/sports-betting-analysis-review-g1o0co]
    paths:
      - "api/**"
      - "src/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/deploy-staging.yml"
      # forward-capture commits refresh the stores baked into the image, so
      # staging's Today/Odds data follows the hourly captures automatically
      # (concurrency group serializes; volume-backed app db is unaffected).
      - "data/processed/**"
      - "data/watch/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - secret present
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "FLY_API_TOKEN repository secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      # F-2: the historical stores are git-ignored and live only in the
      # daily-loop cache. Restore the newest one so deploy/Dockerfile can
      # COPY them into the image; the matchup page reads them for team
      # records, starter form, bullpen and lineups. The key never matches
      # (it carries this run's id) so restore-keys always resolves to the
      # newest daily-loop save. A miss is not fatal: the image builds with
      # an empty data/historical/ and the API states each gap.
      - name: Restore historical stores from the daily-loop cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/historical/statcast
            data/historical/mlb_results.csv
            data/historical/mlb_results.manifest.json
            data/historical/pitcher_logs.jsonl
            data/historical/bullpen_log.jsonl
            data/historical/lineups.jsonl
            data/historical/handedness.json
            data/historical/standings.jsonl
            data/historical/matchup_history.jsonl
            data/historical/matchup_pairs.json
            data/historical/pitcher_splits.json
            data/historical/arsenals
            data/historical/transactions.jsonl
          key: daily-loop-data-${{ github.run_id }}
          restore-keys: |
            daily-loop-data-
      - name: Report which stores the image will carry
        run: ls -la data/historical/ || true
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy -c deploy/fly.staging.toml -a linehound-staging --remote-only --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # TWO PHASES, AND THE SECOND ONE EXISTS BECAUSE OF 2026-09-10.
      #
      # This step used to exit 0 on the first successful /health and stop.
      # That day a deploy passed it and the app was returning 503 within the
      # hour: /health touches no store, and the card endpoint was parsing a
      # 38 MB odds file per request on a 512 MB machine. Nothing broke until
      # a person opened the page, by which time the workflow was long green.
      #
      # Phase 1 waits for the app to come up. Phase 2 then EXERCISES THE
      # PAGE PATH -- a request that actually builds a card -- and keeps
      # checking health for a further minute, so a container that dies under
      # its first real request fails the deploy that shipped it.
      - name: Health check
        run: |
          set -u
          BASE=https://linehound-staging.fly.dev
          up=0
          for i in $(seq 1 12); do
            if curl -sf "$BASE/health" >/dev/null; then up=1; break; fi
            sleep 10
          done
          if [ "$up" -ne 1 ]; then
            echo "health check did not pass within 2 minutes"; exit 1
          fi
          echo "up; now exercising the page path"

          # The card route is behind the paid gate, so 401 is the SUCCESS
          # case here -- it proves the route is mounted and the app answered.
          # What must not happen is a 5xx or a dropped connection, which is
          # what an out-of-memory container produces.
          TODAY=$(date -u +%Y-%m-%d)
          for path in "/card/$TODAY" "/card/record" "/opportunities/$TODAY" "/today"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$BASE$path" || echo 000)
            echo "  $path -> $code"
            case "$code" in
              5*|000) echo "ESCALATE: $path returned $code -- the deploy is up but cannot serve a page"; exit 1 ;;
            esac
          done

          # Still alive a minute after doing real work?
          for i in $(seq 1 6); do
            sleep 10
            if ! curl -sf "$BASE/health" >/dev/null; then
              echo "ESCALATE: the app answered a page request and then stopped responding -- almost certainly out of memory"
              exit 1
            fi
          done
          echo "healthy, and still healthy after serving real requests"
