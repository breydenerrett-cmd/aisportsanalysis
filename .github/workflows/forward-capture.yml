# Runs scripts/capture_slot.sh (one forward-capture slot: watch, umpires,
# one dense odds capture, prop listing, extras, commit+push) on a schedule
# independent of any interactive Claude session/container. See
# docs/CAPTURE_EXTERNALIZATION.md for the reliability/cost/credential-safety
# comparison this workflow implements (Option A).
#
# Requires ONE repository secret: ODDS_API_KEY (same variable name as
# .env / .env.example -- src/providers/odds.py's ENV_KEY). Without it,
# dense/prop_listing/prop_prices all report "not configured" and no-op --
# this workflow still runs, commits nothing new for the odds side, and
# never fails just because the key is missing (mirrors odds_provider.status()
# never failing on an absent key).
#
# GITHUB_TOKEN pushes do not themselves trigger other workflows (GitHub's
# loop-prevention rule), so deploy-staging.yml would NOT redeploy on this
# workflow's data pushes even though its own `paths:` filter watches
# data/watch and data/processed. The explicit workflow_dispatch call below
# reproduces that "staging follows captures" behavior without a second
# credential.
name: forward-capture

on:
  schedule:
    # Every 15 minutes, matching forward_capture.sh's internal 4x15-minute
    # dense cadence -- run four times an hour instead of one 45-minute
    # process. GitHub disables a public repo's scheduled workflow after 60
    # days with no repository activity; this repo has multiple pushes a
    # day (deploy-staging.yml, this workflow's own commits), so that guard
    # should never trip here, but a stalled schedule is worth checking for
    # if data/watch stops growing.
    #
    # 2026-09-14: in practice this fires every 2-5 HOURS, not every 15
    # minutes, and GitHub reads it from the DEFAULT branch's copy of this
    # file, not this one. It stays as the RESTART BACKSTOP for the
    # self-chaining cadence below: the default copy runs this branch's
    # scripts/capture_slot.sh, which chains on exit whenever the running
    # workflow file has no chain step (see "Chain the next slot").
    - cron: "*/15 * * * *"
  # SELF-CHAINING CADENCE (2026-09-14, docs/CAPTURE_EXTERNALIZATION.md,
  # "Self-chaining cadence"). The `pace` job of every run dispatches the next
  # run of this file with capture_now=0 and its own slot start, so slots land
  # about every 13-15 minutes without anyone's session. A hand dispatch sends
  # no inputs and gets the defaults: CAPTURE_NOW=1, no spacing wait.
  workflow_dispatch:
    inputs:
      capture_now:
        description: "1 = hand dispatch: price the whole slate and take every prop capture due now. The chain sends 0."
        required: false
        default: "1"
      prev_slot_start:
        description: "Chain only: epoch seconds the previous slot started. Empty = start now."
        required: false
        default: ""
      spacing_minutes:
        description: "Chain only: minutes after prev_slot_start to start (13 on game days, 60 in quiet hours; bounded 13-60)."
        required: false
        default: ""

# NO workflow-level concurrency here (revised 2026-09-14 after review). The
# shared `forward-capture` group moved onto the `capture` job below, so the
# pacing wait, the chain dispatch and the rival check run OUTSIDE the group
# and block nobody. The first version slept inside the group: it held the
# group ~13 minutes of every 13, so afternoon-slate went pending nearly every
# day, where any forward-capture that queued after it without checking (the
# default branch's cron copy) cancelled it; and each time it yielded to a
# rival the chain ended until the next cron firing, hours later.
# Job-level and workflow-level groups share one namespace per repository
# (GitHub docs, "Using concurrency": "a single job or workflow using the same
# concurrency group"), so the capture job still serialises against
# afternoon-slate and the default branch's cron copy.

permissions:
  contents: write
  actions: write

jobs:
  # Holds no concurrency group. Three steps, in this order on purpose:
  # wait out the spacing, dispatch the successor (which itself cannot join the
  # group for 13+ minutes, so the dispatch can cancel nothing), then check the
  # group LAST so the gap between that read and the capture job queuing is
  # seconds.
  #
  # The mode calls use `run: |` blocks: tests/test_capture_stages_what_it_writes.py
  # identifies THE slot as the single one-line `run: bash scripts/capture_slot.sh`,
  # and these modes exit before any slot work.
  pace:
    runs-on: ubuntu-latest
    # Up to 60 minutes of quiet-hours spacing + 30 of gate + margin.
    timeout-minutes: 100
    outputs:
      yielded: ${{ steps.gate.outputs.yielded }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/sports-betting-analysis-review-g1o0co
          fetch-depth: 1

      # A chained run waits here until ~13 minutes after the previous slot
      # started (hourly in quiet hours), bounded. A hand dispatch carries no
      # prev_slot_start and passes straight through.
      - name: Space this slot from the previous one (chained runs only)
        id: spacing
        env:
          PREV_SLOT_START: ${{ inputs.prev_slot_start }}
          SPACING_MINUTES: ${{ inputs.spacing_minutes }}
        run: |
          bash scripts/capture_slot.sh --space-only

      # Dispatches the next run of this file (2026-09-14,
      # docs/CAPTURE_EXTERNALIZATION.md "Self-chaining cadence"), BEFORE this
      # run's slot: a failed, skipped or cancelled slot cannot end the chain.
      #
      # always(): a failed spacing step or a cancelled run still chains -- the
      # chain ends only by decision (a newer live run of this branch carries
      # it), never by accident. A dispatch that cannot happen (no gh, no token,
      # API refusal) fails THIS step, so the run shows red instead of the
      # cadence quietly stopping; the slot below still runs.
      #
      # Kill switch: set the repository variable CAPTURE_CHAIN=off (Settings ->
      # Secrets and variables -> Actions -> Variables). always() means
      # cancelling a run does NOT stop the chain; this variable does.
      - name: Chain the next slot
        if: always() && vars.CAPTURE_CHAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLOT_START_EPOCH: ${{ steps.spacing.outputs.slot_start }}
          CAPTURE_CHAIN: ${{ vars.CAPTURE_CHAIN }}
          CHAIN_SELF_RUN_ID: ${{ github.run_id }}
        run: |
          bash scripts/capture_slot.sh --chain-only

      # MUST STAY THE LAST STEP OF THIS JOB. GitHub cancels a PENDING run in a
      # concurrency group when a newer one queues, so the capture job must not
      # queue while a daily-loop or afternoon-slate is waiting there. Waits
      # (up to 30 minutes, outside the group) for it to start; if it never
      # does, this slot is skipped, never the rival.
      - name: Wait until joining the shared group cancels nobody
        id: gate
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/capture_slot.sh --gate-only

  capture:
    needs: pace
    # !cancelled(): a red chain step (dispatch refused) must not cost the slot.
    # yielded must be exactly 'false' -- an unset output (gate did not run)
    # skips the slot rather than joining the group unchecked.
    if: ${{ !cancelled() && needs.pace.outputs.yielded == 'false' }}
    runs-on: ubuntu-latest
    # The shared group (with afternoon-slate and the default branch's cron
    # copy): at most ONE running and ONE pending entry, a newer pending entry
    # cancels the older. cancel-in-progress must stay false, or a slot could
    # cancel the running slot or afternoon-slate before it.
    concurrency:
      group: forward-capture
      cancel-in-progress: false
    steps:
      # Scheduled workflows only run from the repository's DEFAULT branch,
      # and this repo's default branch is an orphan that shares no history
      # with the working line. The working line is therefore named
      # explicitly here so the job captures into and pushes to it wherever
      # the workflow file happens to live (docs/CAPTURE_EXTERNALIZATION.md,
      # "Default-branch constraint"). This job starts after the pacing wait,
      # so the checkout is current.
      - uses: actions/checkout@v4
        with:
          ref: claude/sports-betting-analysis-review-g1o0co
          fetch-depth: 0

      - name: Configure git identity for the commit this run may make
        run: |
          git config user.name "forward-capture-bot"
          git config user.email "actions@users.noreply.github.com"
      # READ-ONLY restore of whatever the daily loop last saved. This job never
      # writes back to `daily-loop-data-` (that key belongs to daily-loop.yml,
      # which saves the full ~200MB set once a day); it only needs the
      # git-ignored stores `engine slate` reads -- the Statcast pitch store the
      # pre-slate coverage guard checks, the handedness cache every lineup
      # feature joins through, the results store. On a genuine miss nothing
      # here fails: the lineup step below refuses out loud and the scheduled
      # 10:00Z and 21:10Z passes are untouched.
      - name: Restore the daily loop's git-ignored inputs (read-only)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/historical/statcast
            data/historical/mlb_results.csv
            data/historical/mlb_results.manifest.json
            data/historical/pitcher_logs.jsonl
            data/historical/bullpen_log.jsonl
            data/historical/lineups.jsonl
            data/historical/handedness.json
            data/historical/matchup_history.jsonl
            data/historical/matchup_pairs.json
            data/historical/pitcher_splits.json
            data/historical/arsenals
            data/historical/standings.jsonl
          key: forward-capture-never-saved-${{ github.run_id }}
          restore-keys: |
            daily-loop-data-

      # Restored SECOND, and deliberately: the daily-loop cache above carries a
      # copy of lineups.jsonl as it stood at 10:00Z, and this smaller cache
      # carries the same file as the last capture slot left it -- hours of
      # afternoon postings later. Last restore wins, so the fresher store is
      # the one on disk.
      - name: Restore the intraday posted-lineup store
        uses: actions/cache/restore@v4
        with:
          path: |
            data/historical/lineups.jsonl
            data/historical/handedness.json
            data/historical/matchup_history.jsonl
            data/historical/matchup_pairs.json
          key: lineup-store-${{ github.run_id }}
          restore-keys: |
            lineup-store-

      # CAPTURE_NOW (2026-09-14): a hand-dispatched run prices the whole slate
      # and takes every prop capture still due right now, instead of waiting
      # for the clock (scripts/capture_slot.sh, src/pipeline/batter_props.py).
      # Scheduled runs never set it. Dispatch this branch's copy:
      #   gh workflow run forward-capture.yml --ref claude/sports-betting-analysis-review-g1o0co
      # A CHAINED dispatch is also a workflow_dispatch event, so the event name
      # alone no longer tells a hand from the chain (2026-09-14): the input
      # does. A hand dispatch sends none and gets the default '1'; the chain
      # sends capture_now=0. The comparison is spelled out because the string
      # '0' is truthy in an Actions expression.
      - name: Capture one slot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          CAPTURE_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_now == '1' && '1' || '' }}
          # This file chains in its `pace` job; the script must not also.
          CHAIN_BY_WORKFLOW_STEP: "1"
        run: bash scripts/capture_slot.sh

      # THE P0 CHANGE (2026-09-08). `lineup_store.build` was called from
      # exactly one place, the 10:00Z daily loop -- hours before lineups post.
      # Measured over the 1,055 played decisions then in the ledger: the
      # FORWARD_TEST systems (the product; the only ones that require a posted
      # lineup) froze a median 8.9 minutes before first pitch, 72% of them
      # inside 30 minutes, while the null baselines that need no lineup decided
      # with a 7-9 HOUR median lead. The lineups were not the late part: the
      # first capture holding a complete card sat a median 160 minutes before
      # first pitch, so the median decision was frozen 137 minutes after its
      # own inputs existed. This step closes that gap -- it tops the store up
      # on the capture cadence and then, ONLY when a lineup has landed since
      # the last frozen decision set, runs one more slate pass.
      #
      # ENRICHMENT, NEVER A BLOCKER: `|| true` on every command and
      # `if: always()` on the step, so a stalled MLB call or a cold cache costs
      # this pass its slate and nothing else. The capture above has already
      # committed; the scheduled 10:00Z and 21:10Z passes run regardless.
      - name: Refresh the posted-lineup store, and decide if a lineup has posted
        if: always()
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d 'yesterday' +%Y-%m-%d)
          python3 -c "
          from src.pipeline import lineup_store, matchup_history
          try:
              r = lineup_store.build(['$YESTERDAY', '$TODAY'],
                                     refresh=['$YESTERDAY', '$TODAY'])
              print('lineups: %d date(s) fetched, %d game(s) written, '
                    '%d topped up on a date already covered, %d failed'
                    % (r['dates'], r['games'], r['topped_up'], r['failed']))
          except Exception as exc:
              print('(lineups unavailable:', exc, ')')
          # TODAY ONLY and this cadence does not change that: the vsPlayer
          # endpoint returns CAREER totals with no as-of parameter, so asking
          # it about an already-played game would bake that game into its own
          # history. A POSTED LINEUP is a fixed fact once posted and may be
          # refreshed as often as we like; the two are not the same and must
          # not be treated as one.
          try:
              r = matchup_history.build('$TODAY')
              print('matchup_history: %s' % (r.get('error') or
                    '%d game(s), %d written, %d stored, %d no lineup yet'
                    % (r['games'], r['written'], r['skipped_stored'],
                       r['skipped_no_lineup'])))
          except Exception as exc:
              print('(matchup_history unavailable:', exc, ')')
          " || true

          # The gate lives in src.pipeline.lineup_store.slate_due, not in this
          # YAML: see its docstring for why it is stateless (a marker file
          # under a git-ignored path reads as "never ran" on a fresh Actions
          # checkout, which would fire this on every single slot -- the exact
          # failure the gate exists to prevent). Keeping the decision in one
          # unit-tested function is also what stops this workflow and
          # scripts/forward_capture.sh drifting apart on what "due" means.
          GATE=$(python3 -c "
          from src.pipeline import lineup_store
          gate = lineup_store.slate_due()
          print('RUN' if gate['due'] else 'SKIP', gate['reason'])
          " 2>&1) || GATE="SKIP the gate could not read its stores"
          echo "$GATE"

          # scripts/afternoon_slate.sh is reused verbatim rather than
          # reimplemented here: it already runs `engine slate` for TODAY and
          # nothing else, buys no prices, commits evidence + paper accounts
          # under the shared git lock, and its own header documents why TWO
          # FROZEN DECISION SETS FOR ONE DATE IS INTENDED. Staking is
          # idempotent per position (src.engine.slate.position_key_for) and
          # run_slate's live-mode guard skips any game already under way, so a
          # third, fourth or tenth pass in a day adds decisions without
          # double-staking anything and without touching decision identity.
          if [ "${GATE%% *}" = "RUN" ]; then
            bash scripts/afternoon_slate.sh || \
              echo "lineup-cadence slate pass did not complete cleanly -- see above; the scheduled 10:00Z and 21:10Z passes are unaffected"
          fi

      # Saved every slot so the next one starts from the afternoon's postings
      # rather than from the 10:00Z snapshot. Small (a few hundred KB against
      # the daily loop's ~200MB), and keyed per run because actions/cache is
      # immutable per key. daily-loop.yml restores this same prefix after its
      # own, so a day of intraday top-ups reaches the morning's full run.
      - name: Save the intraday posted-lineup store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/historical/lineups.jsonl
            data/historical/handedness.json
            data/historical/matchup_history.jsonl
            data/historical/matchup_pairs.json
          key: lineup-store-${{ github.run_id }}

      - name: Dispatch staging redeploy if data changed (at most hourly)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="claude/sports-betting-analysis-review-g1o0co"
          # Four slots an hour would mean four staging restarts an hour;
          # only the first slot of each hour (minute 00-14) redeploys, which
          # keeps staging's baked-in stores at most an hour behind -- the
          # same cadence the in-session hourly run gave it.
          MINUTE=$(date -u +%M)
          if [ "${MINUTE#0}" -ge 15 ]; then
            echo "minute ${MINUTE}: not the first slot of the hour -- no redeploy this run"
          elif git log -1 --pretty=%s | grep -q "^Forward capture slot"; then
            curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-staging.yml/dispatches" \
              -d "{\"ref\":\"${BRANCH}\"}" || echo "deploy dispatch failed (non-fatal, staging just stays on its last image until the next real code push)"
          else
            echo "no new capture commit this run -- nothing to redeploy for"
          fi

      # PRODUCTION DATA REFRESH (2026-09-22). The app bakes its stores into the
      # image, so without this, linehound.app would show whatever data existed
      # at the last manual deploy, and picks and odds would be hours stale
      # within a day. Same hourly cadence as staging, with two extra gates:
      #   1. OFF until FLY_PROD_API_TOKEN exists. Before the owner creates the
      #      app and sets that secret, nothing is dispatched and nothing fails.
      #   2. Only when the latest completed CI (tests) run on this branch
      #      passed. A red suite never ships to paying customers.
      # deploy-prod.yml itself stays workflow_dispatch-only, pins the working
      # branch, waits for warm-up and runs its own page checks.
      - name: Dispatch production data refresh (hourly, CI-green, once prod exists)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_TOKEN_PRESENT: ${{ secrets.FLY_PROD_API_TOKEN != '' }}
        run: |
          BRANCH="claude/sports-betting-analysis-review-g1o0co"
          MINUTE=$(date -u +%M)
          if [ "$PROD_TOKEN_PRESENT" != "true" ]; then
            echo "FLY_PROD_API_TOKEN not set -- production not live yet, no refresh"
          elif [ "${MINUTE#0}" -ge 15 ]; then
            echo "minute ${MINUTE}: not the first slot of the hour -- no production refresh this run"
          elif ! git log -1 --pretty=%s | grep -q "^Forward capture slot"; then
            echo "no new capture commit this run -- nothing to refresh"
          else
            CI=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?branch=${BRANCH}&status=completed&per_page=1" \
              | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs') or []; print(r[0]['conclusion'] if r else 'none')" || echo "unknown")
            if [ "$CI" != "success" ]; then
              echo "latest CI run is '${CI}', not success -- production NOT refreshed (staging still is)"
            else
              curl -sS -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/dispatches" \
                -d "{\"ref\":\"${BRANCH}\"}" || echo "prod refresh dispatch failed (non-fatal; production keeps its last image)"
            fi
          fi
