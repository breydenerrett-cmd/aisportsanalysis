# One-off, READ-ONLY probe: what can FLY_API_TOKEN actually do?
#
# WHY THIS EXISTS. deploy/DEPLOY_RUNBOOK.md's promotion checklist needs
# `fly apps create linehound-prod`, and .github/workflows/deploy-staging.yml's
# header describes FLY_API_TOKEN as "an app-scoped deploy token for
# linehound-staging". If that is accurate, the token cannot create a second
# app and Brey has to issue an account-scoped one. If it is NOT accurate --
# the comment could simply predate a token rotation -- then production can be
# stood up from CI with what is already configured.
#
# That is a cheap question to answer and an expensive one to guess at, so
# this asks Fly directly. Every command below is READ-ONLY: `apps list` and
# `orgs list` create nothing, deploy nothing, and cost nothing. There is no
# `apps create` here on purpose -- this probe establishes the capability, and
# a separate, reviewable change uses it.
#
# Delete this file once the answer is recorded in the runbook.
name: fly-scope-probe

"on":
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - token present
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "FLY_API_TOKEN is not set; nothing to probe."
            exit 1
          fi
          echo "token present"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: What apps can this token see?
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== flyctl apps list ==="
          flyctl apps list || echo "apps list FAILED (exit $?)"
          echo
          echo "=== flyctl orgs list ==="
          flyctl orgs list || echo "orgs list FAILED (exit $?)"
          echo
          echo "Reading the result:"
          echo "  only linehound-staging  -> app-scoped, cannot create prod"
          echo "  several apps / an org   -> account-scoped, prod can be"
          echo "                             created from CI"
