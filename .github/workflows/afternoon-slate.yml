# A SECOND slate pass, late enough in the day that lineups exist.
#
# Finding F-1 (docs/DEMO_SHIP_CHECKLIST.md, 2026-09-07): all sixteen evolab
# genome systems require a posted lineup, and the 10:00Z daily loop freezes
# the slate seven to twelve hours before lineups post -- so every genome has
# refused NO_LINEUP on every game since the loop moved to Actions on 09-05,
# leaving only null baselines and market references deciding. This restores
# the pre-09-05 behaviour (the old cloud session ran the loop repeatedly
# through the day; every genome decision in the ledger carries a decision_utc
# between 16:25Z and 01:51Z).
#
# Runs `engine slate` and NOTHING else -- see scripts/afternoon_slate.sh for
# why settle and eod stay the 10:00Z loop's job, and why two frozen decision
# sets for one date is the intended shape rather than a duplicate.
#
# Requires the same single repository secret as the other data-plane
# workflows: ODDS_API_KEY. This pass buys no prices (it decides against the
# board forward capture already paid for), but `engine slate`'s own L1
# refresh reads the odds provider's status, and the key is passed for parity
# with daily-loop.yml rather than left to fail differently here.
name: afternoon-slate

on:
  schedule:
    # 15:40 UTC = 11:40am Eastern. MOVED FROM 21:10 UTC (5:10pm ET) ON
    # 2026-09-10, AND THE OLD TIME WAS COSTING A CARD A WEEK.
    #
    # `card publish` runs only from this workflow, and run_slate's first-pitch
    # guard skips games already under way -- correctly, since a card cannot
    # freeze a bet after the game has started. At 5:10pm Eastern that guard
    # was throwing away the whole afternoon.
    #
    # Measured over the last 45 slates in data/historical/mlb_results.csv:
    #
    #   publish ET   days with <3 games open   share of games excluded
    #      11:40              0  (0%)                     0%
    #      13:40              0  (0%)                    10%
    #      15:40              1  (2%)                    24%
    #      17:10              8 (18%)                    33%   <- the old time
    #
    # daily_card.MIN_PICKS is 3 and the standing rule is three to five bets
    # every day no matter what. One day in five the automatic card physically
    # could not make three -- Sundays worst, where 2026-08-23 and 2026-08-30
    # left ONE game open out of fifteen.
    #
    # 11:40 is the LATEST time that costs nothing: the earliest first pitch in
    # the sample is 12:10 ET, so this is pre-game for every game on every
    # slate in it, and later means a more mature board.
    #
    # WHAT IT COSTS, STATED. Evening lineups are not posted at 11:40 -- they
    # land 17:16Z-22:39Z. The card does not read lineups (that is the
    # player-props surface, which does not ship), so the cost is board depth
    # rather than correctness, and the 2026-09-10 card settles it: published
    # 10:36am ET, it priced a 7:05pm game across eight books.
    #
    # THE SCHEDULE LIVES ON THIS BRANCH AND THE CODE DOES NOT. GitHub reads
    # cron from the default branch; the job below checks out the working
    # branch for everything else. A change to the working branch's copy of
    # this block would have looked right and fired at the old time.
    #
    # Deliberately not on the hour: every repository asks for :00.
    # FOUR RUNS A DAY, 2026-09-11 (owner asked for three to five).
    #
    # 15:40 UTC = 11:40am ET   before the earliest first pitch on any slate
    # 18:40 UTC =  2:40pm ET
    # 21:40 UTC =  5:40pm ET
    # 23:40 UTC =  7:40pm ET
    #
    # IT COSTS NOTHING. `card publish` reads the free MLB schedule and local
    # stores; it makes no paid odds call. The only thing more runs buy is a
    # later read on games that have not started.
    #
    # WHY IT IS WORTH BUYING. card_ledger.publish locks each pick against ITS
    # OWN first pitch and carries locked picks forward untouched, so every
    # run improves the games still open and cannot touch the ones that are
    # not. The bet of record is the last version written before that game
    # began -- "not the preview or early bets", which is the point.
    #
    # ALL FOUR SIT INSIDE ONE UTC DAY ON PURPOSE. afternoon_slate.sh derives
    # $TODAY from the UTC clock, and Eastern is UTC-4 all season, so 15:40
    # through 23:40 UTC are 11:40am through 7:40pm on the SAME Eastern date.
    # A run at, say, 01:40 UTC would be 9:40pm ET on the previous day's slate
    # and would publish against the wrong date.
    #
    # A 10:10pm ET game still locks: its window opens 6:10pm ET and the 23:40
    # run closes it.
    - cron: "40 15 * * *"
    - cron: "40 18 * * *"
    - cron: "40 21 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch: {}

# The same group forward-capture and daily-loop share. All three commit and
# push to one branch under a lock that is process-local (flock) and therefore
# useless across runners; the Actions-level group is the only lock that
# actually reaches between them.
concurrency:
  group: forward-capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  slate:
    runs-on: ubuntu-latest
    # Slate-only, on a warm cache, is a couple of minutes. The ceiling covers
    # a cold runner having to restore the Statcast seed first.
    timeout-minutes: 25
    steps:
      # Scheduled workflows only run from the repository's DEFAULT branch,
      # which here is an orphan sharing no history with the working line, so
      # the working branch is named explicitly -- same as the other two
      # data-plane workflows.
      - uses: actions/checkout@v4
        with:
          ref: claude/sports-betting-analysis-review-g1o0co
          fetch-depth: 0

      - name: Configure git identity for the commit this run may make
        run: |
          git config user.name "afternoon-slate-bot"
          git config user.email "actions@users.noreply.github.com"

      # Restores whatever the morning daily-loop saved a few hours earlier
      # (same `daily-loop-data-` prefix, restore-keys prefix match), so the
      # Statcast pitch store the pre-slate guard checks is already on disk and
      # bootstrap has nothing to rebuild.
      #
      # RESTORE ONLY, NEVER SAVE (2026-09-21 incident fix). This job used to
      # re-save these paths under the same prefix after every run, about
      # every 30 minutes. It never advances them itself -- statcast catchup
      # runs only in the daily loop -- and restore-keys resolves to the MOST
      # RECENTLY CREATED entry, so its no-op re-saves buried the daily loop's
      # single real advance. The slate kept reading pitch coverage ending
      # 2026-09-14 while the daily loop's store reached 09-18, and the
      # pre-slate guard refused the afternoon board every day from 09-18. A
      # failed 10:00Z loop is still covered by bootstrap's seed-branch
      # restore. The working branch's copy of this file carries the same
      # change (efaf3239); this is the copy the schedule actually runs.
      #
      # THE ACTUAL ROOT CAUSE (2026-09-21, found after the fix above did not
      # clear the refusal): a cache entry only matches a restore whose `path`
      # list is IDENTICAL, because the path list is hashed into the entry's
      # version. The daily loop saves TWELVE paths, and this step listed
      # seven. So this job never saw one daily-loop save. It restored only
      # its own old saves (version 01d0944ab7 vs the daily loop's 6a008b5f8a),
      # a closed loop frozen at Statcast coverage 2026-09-14. The GitHub cache
      # API showed it: the 17:55Z run restored the 02:43Z entry and skipped
      # the daily loop's 16:11Z one. The list below MUST stay byte-identical
      # to daily-loop.yml's save step. Restore-only, never actions/cache: the
      # combined action saves again in its post step.
      - name: Restore historical + processed data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/historical/statcast
            data/historical/mlb_results.csv
            data/historical/mlb_results.manifest.json
            data/historical/pitcher_logs.jsonl
            data/historical/bullpen_log.jsonl
            data/historical/lineups.jsonl
            data/historical/handedness.json
            data/historical/matchup_history.jsonl
            data/historical/matchup_pairs.json
            data/historical/pitcher_splits.json
            data/historical/arsenals
            data/historical/standings.jsonl
          key: daily-loop-data-${{ github.run_id }}
          restore-keys: |
            daily-loop-data-

      # Every path above except data/historical/statcast is now tracked in
      # git, and the checkout is at least as fresh as any cache save (the
      # capture slots commit posted lineups hours after the 10:00Z loop
      # saves). So put git's copies back and keep ONLY the untracked pitch
      # store from the cache. Without this, a stale cached lineups.jsonl
      # would hide lineups posted since the morning -- the exact case the
      # afternoon pass exists for (genomes stand down NO_LINEUP otherwise).
      - name: Keep git's tracked historical stores over the cache's copies
        run: git checkout -- data/historical

      # Same hard stops as the daily loop: a missing Statcast manifest that
      # the seed branch cannot supply is a refusal, not a silent full build.
      - name: Bootstrap git-ignored inputs (restore from seed, or refuse)
        run: |
          set -o pipefail
          bash scripts/daily_bootstrap.sh 2>&1 | tee /tmp/afternoon_slate.out
          exit "${PIPESTATUS[0]}"

      - name: Run the afternoon slate pass
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          bash scripts/afternoon_slate.sh 2>&1 | tee -a /tmp/afternoon_slate.out
          exit "${PIPESTATUS[0]}"

      - name: Fail the job on any ESCALATE line
        if: always()
        run: |
          if grep -q "^ESCALATE:" /tmp/afternoon_slate.out; then
            echo "The afternoon slate escalated -- see the lines below."
            grep "^ESCALATE:" /tmp/afternoon_slate.out
            exit 1
          fi
          echo "no ESCALATE lines -- clean run"
