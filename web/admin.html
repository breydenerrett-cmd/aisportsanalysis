<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1116">
<title>LINEHOUND Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0C0E'/%3E%3Cpath d='M6 6l8 0 0 9-8 4z' fill='%23FF3D57'/%3E%3Cpath d='M18 6l8 0 0 13-8-4z' fill='%23FF7A45'/%3E%3C/svg%3E">
<!-- THE ADMIN DASHBOARD (owner, 2026-10-19). Private: not linked from anywhere, noindex, and every
     request carries the admin token in a header (web/js/admin.js). Page script: web/js/admin-app.js,
     which draws five tabs from GET /admin/overview, /admin/users, /admin/testers, /admin/comps,
     /admin/funnel, /admin/support and /admin/revenue. The sign-in card below is the only thing
     shown until a token is accepted, and it is shown again if the server rejects the saved token.
     The token field is never filled in: a saved token is not shown back. -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/lh.css">
<link rel="stylesheet" href="css/lh-app.css">
</head>
<body class="adm-page">
<a class="skip-link" href="#adm-main">Skip to the dashboard</a>
<div class="adm-app" data-hook="admin-app">

  <header class="adm-top" data-hook="admin-header">
    <div class="adm-top__brand">
      <span class="wordmark" data-hook="brand-mark">
        <span class="wordmark__mark"><span></span></span>
        <span class="wordmark__text" data-hook="product-name">LINEHOUND</span>
      </span>
      <span class="adm-top__label">Admin</span>
    </div>
    <div class="adm-top__right">
      <span class="adm-top__updated" data-hook="admin-updated" role="status"></span>
      <button type="button" class="adm-btn adm-btn--ghost adm-btn--sm" data-hook="admin-refresh" hidden>Refresh</button>
      <span class="adm-chip adm-chip--mute" data-hook="admin-token-chip" data-tone="mute">Not signed in</span>
      <button type="button" class="adm-btn adm-btn--ghost adm-btn--sm" data-hook="admin-signout" hidden>Sign out of admin</button>
    </div>
  </header>

  <!-- Sign-in card: shown when no token is saved or the saved one is rejected. -->
  <section class="adm-gate" data-hook="admin-gate" aria-label="Admin sign-in">
    <form class="adm-gate__card" data-hook="admin-gate-form" novalidate>

      <p class="adm-gate__kicker">Back office</p>
      <h1 class="adm-gate__title">Admin sign-in</h1>
      <p class="adm-gate__text">Paste the admin token. It stays in this browser tab until you sign out or close the tab, and it is never shown again.</p>
      <div class="adm-field">
        <label class="adm-field__label" for="admin-token-input">Admin token</label>
        <input type="password" id="admin-token-input" name="token" autocomplete="off" spellcheck="false" data-hook="admin-token-input">
      </div>
      <p class="adm-gate__message" role="alert" data-hook="admin-gate-message" data-tone="mute"></p>
      <button type="submit" class="adm-btn adm-btn--primary adm-btn--block" data-hook="admin-gate-submit">Sign in</button>
    </form>
  </section>

  <p class="adm-loading" data-hook="admin-loading" role="status" hidden>Loading the dashboard...</p>

  <div class="adm-shell" data-hook="admin-shell" hidden>
    <nav class="adm-nav" aria-label="Admin sections" data-hook="admin-nav">
      <button type="button" class="adm-nav__item" data-hook="admin-nav-item" data-route="overview" aria-current="page">Overview</button>
      <button type="button" class="adm-nav__item" data-hook="admin-nav-item" data-route="people">People<span class="adm-nav__badge" data-hook="admin-nav-badge" data-for="people" hidden>0</span></button>
      <button type="button" class="adm-nav__item" data-hook="admin-nav-item" data-route="funnel">Funnel</button>
      <button type="button" class="adm-nav__item" data-hook="admin-nav-item" data-route="health">Health<span class="adm-nav__badge adm-nav__badge--bad" data-hook="admin-nav-badge" data-for="health" hidden>0</span></button>
      <button type="button" class="adm-nav__item" data-hook="admin-nav-item" data-route="support">Support<span class="adm-nav__badge" data-hook="admin-nav-badge" data-for="support" hidden>0</span></button>
    </nav>

    <main class="adm-main" id="adm-main">
      <div data-hook="admin-banner"></div>

      <section class="adm-view" data-hook="admin-view-overview" aria-label="Overview">
        <h1 class="adm-view__title">Overview</h1>
        <div data-hook="admin-host-overview"></div>
      </section>

      <section class="adm-view" data-hook="admin-view-people" aria-label="People" hidden>
        <h1 class="adm-view__title">People</h1>
        <div data-hook="admin-host-people"></div>
      </section>

      <section class="adm-view" data-hook="admin-view-funnel" aria-label="Funnel" hidden>
        <h1 class="adm-view__title">Funnel</h1>
        <div data-hook="admin-host-funnel"></div>
      </section>

      <section class="adm-view" data-hook="admin-view-health" aria-label="Health" hidden>
        <h1 class="adm-view__title">Health</h1>
        <div data-hook="admin-host-health"></div>
      </section>

      <section class="adm-view" data-hook="admin-view-support" aria-label="Support" hidden>
        <h1 class="adm-view__title">Support</h1>
        <div data-hook="admin-host-support"></div>
      </section>
    </main>
  </div>

  <div class="adm-toasts" data-hook="admin-toasts" role="status" aria-live="polite"></div>
  <div data-hook="admin-menu-root"></div>
  <div data-hook="admin-modal-root"></div>
</div>

<script type="module" src="js/admin-app.js"></script>
</body>
</html>
