<!-- THE HOUND QUIZ. Eight this-or-that questions (sports, what it bets on, personality, risk, timing, favorite moves, quirks, look),
     every one skippable, then a reveal: the hound, its name, its rules in plain English as rule cards, and a box to add anything in
     your own words. Page script: web/js/hound-quiz.js (art: web/js/hound-quiz-art.js, look: web/css/quiz.css). EVERYTHING the quiz
     offers comes from GET /hounds/quiz/library (config/hounds_archetypes.json), and the answers become a spec through
     POST /hounds/quiz/compose, which runs the real validator; the English shown for each rule is generated by the server's
     renderer, never written in this file. "Send my hound in" is the builder's own save door (POST /hounds), and "Edit rules" hands
     the draft to the builder. The paper-only notice and the -200 cap line are STATIC so they are on the page with scripts off. -->
