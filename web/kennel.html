<!-- KENNEL (web/js/kennel.js). Two views of one page:
       kennel.html           MY KENNEL, for a signed-in member: each dog as a card with its animated avatar and one-tap
                             Unleash / Send to training / Take them out back (the burial) / Ask / Edit / Open, and "Build a dog". Clicking a dog opens the STUDIO, an
                             in-place drawer with tabs (Look, Rules, Unleash, Backtest, Ask, Record) that reuses the dog kit's and
                             the builder's own modules. A signed-out visitor is asked to sign in or to browse kennels.
       kennel.html?u=<handle>  a member's PUBLIC kennel: their non-retired dogs (a dog with no bet yet included), read
                             only. The handle is the anonymous owner label as a slug ("handler-3f2a"); never an email.
     Reads: GET /hounds/kennels/mine, GET /hounds/kennels/{handle}. The paper-only line is static. -->

<main class="hd-wrap hd-wrap--wide" id="main-content" aria-label="Kennel" data-hook="kennel-app">

<header class="kn-head">
  <div>
    <p class="kn-eyebrow" data-hook="kennel-eyebrow">Kennel</p>
    <h1 data-hook="kennel-title">My kennel</h1>
    <p class="hd-lede" data-hook="kennel-sub"></p>
  </div>
  <div class="kn-head__actions" data-hook="kennel-actions"></div>
</header>

<p class="hd-disclosure" data-hook="paper-only-notice" role="note">Paper bets only. Not betting advice. 21+.</p>
<p class="hd-fine kn-status" data-hook="kennel-status" role="status" aria-live="polite"></p>

<div data-hook="kennel-gate" hidden></div>
<div data-hook="kennel-name-slot"></div>
<div data-hook="kennel-profile-slot"></div>
<div class="kn-grid" data-hook="kennel-grid" aria-live="polite"><div class="lh-skel lh-skel--cards" aria-hidden="true"></div><p class="hd-sr-only">Loading the kennel...</p></div>
<div data-hook="kennel-retired"></div>
<div data-hook="kennel-graveyard"></div>
<div data-hook="kennel-extras"></div>

<!-- THE STUDIO: an in-place drawer for one dog (or a new one). Filled by web/js/kennel.js; hidden until a dog is opened. -->
<div class="kn-scrim" data-hook="studio-scrim" hidden></div>
<aside class="kn-studio" data-hook="studio" role="dialog" aria-modal="true" aria-labelledby="studio-title" hidden>
  <header class="kn-studio__head">
    <div class="kn-studio__avatar" data-hook="studio-avatar"></div>
    <div class="kn-studio__who">
      <h2 id="studio-title" data-hook="studio-title">Dog studio</h2>
      <p class="hd-fine" data-hook="studio-sub"></p>
    </div>
    <a class="lh-btn lh-btn--soft" data-hook="studio-open" href="hounds.html" hidden>Open page</a>
    <button type="button" class="kn-act kn-act--quiet kn-studio__remove" data-hook="studio-remove" hidden>Remove from my kennel</button>
    <button type="button" class="kn-studio__close" data-hook="studio-close" aria-label="Close the studio">&times;</button>
  </header>
  <div class="lh-tabs lh-tabs--studio" role="tablist" aria-label="Studio" data-hook="studio-tabs">
    <button type="button" role="tab" data-tab="look" aria-selected="true">Look</button>
    <button type="button" role="tab" data-tab="rules" aria-selected="false">Rules</button>
    <button type="button" role="tab" data-tab="fire" aria-selected="false">Unleash</button>
    <button type="button" role="tab" data-tab="backtest" aria-selected="false">Backtest</button>
    <button type="button" role="tab" data-tab="ask" aria-selected="false">Ask</button>
    <button type="button" role="tab" data-tab="record" aria-selected="false">Record</button>
  </div>
  <div class="kn-studio__body">
    <div class="lh-tabpanel" data-tabpanel="look" role="tabpanel" aria-label="Look" data-hook="studio-look"></div>
    <div class="lh-tabpanel" data-tabpanel="rules" role="tabpanel" aria-label="Rules" data-hook="studio-rules" hidden></div>
    <div class="lh-tabpanel" data-tabpanel="fire" role="tabpanel" aria-label="Unleash" data-hook="studio-fire" hidden></div>
    <div class="lh-tabpanel" data-tabpanel="backtest" role="tabpanel" aria-label="Backtest" data-hook="studio-backtest" hidden></div>
    <div class="lh-tabpanel" data-tabpanel="ask" role="tabpanel" aria-label="Ask" data-hook="studio-ask" hidden></div>
    <div class="lh-tabpanel" data-tabpanel="record" role="tabpanel" aria-label="Record" data-hook="studio-record" hidden></div>
  </div>
</aside>

</main>
