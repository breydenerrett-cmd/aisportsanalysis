<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINEHOUND</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/app.css">
<!-- Belt-and-braces: [hidden] is already display:none per the HTML spec
     and is redeclared with !important in base.css -- this inline rule is
     the last-resort fallback if neither stylesheet loads. -->
<style>[hidden]{display:none}</style>
</head>
<body>
<div class="app-shell">
  <nav class="icon-rail" aria-label="primary" data-hook="primary-nav"></nav>

  <div class="app-content">
    <header class="app-topbar">
      <!-- The wordmark is the standard home link: back to the public
           landing page from any app screen. A real <a> so mouse, Enter,
           and focus behavior come from the platform, not a handler. -->
      <a class="app-topbar__brand" data-hook="product-name" href="landing.html">LINEHOUND</a>
      <div class="app-topbar__token" data-hook="token-form-host" aria-label="invite token entry"></div>
      <a class="app-topbar__support" href="#/support">Support</a>
    </header>

    <main class="app-main" data-hook="app-outlet" aria-label="page content"></main>

    <div class="app-disclaimer-host" data-hook="disclaimer-host" aria-label="disclaimer"></div>
  </div>

  <nav class="tab-bar" aria-label="primary mobile" data-hook="primary-nav-mobile"></nav>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
