<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LINEHOUND</title>
<!-- INSTALLABLE SURFACE (2026-09-10). There was none: no manifest, no
     icons, and not one image file anywhere in web/. The bottom tab bar and
     the fixed Bet Check field were already built and the mobile layout is
     genuinely good, so the only thing standing between this and a home
     screen was the metadata below plus four PNGs.

     `viewport-fit=cover` above pairs with the env(safe-area-inset-*) rules
     in css/app.css: without it iOS letterboxes the page instead of letting
     it reach the edges, and the insets it reports stay zero.

     Icons come from scripts/make_icons.py, which regenerates them from the
     design tokens -- the brand is still a working placeholder pending
     trademark clearance (api/meta.py marks it temporary), so these are
     certain to be replaced and a binary nobody can regenerate is a binary
     nobody dares change. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LINEHOUND">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Typefaces are self-hosted (css/fonts.css): the design's identity must
     not depend on a third-party CDN being reachable, and this page has to
     render identically from file:// with no network at all. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0C0E'/%3E%3Cpath d='M6 6l8 0 0 9-8 4z' fill='%23FF3D57'/%3E%3Cpath d='M18 6l8 0 0 13-8-4z' fill='%23FF7A45'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/gamestory.css">
<link rel="stylesheet" href="css/signup.css">
<!-- THE CARD (web/js/card.js). After app.css and screens.css so it can rely
     on .gutter/.panel/.chamfer/.sechead being defined, and before gotcha.css
     which must stay last. -->
<link rel="stylesheet" href="css/card.css">
<!-- PLAYER PROPS (web/js/props.js). Same position and same reason as
     card.css above: after screens.css so .panel/.chamfer are defined, and
     before gotcha.css, which must stay last. -->
<link rel="stylesheet" href="css/props.css">
<!-- The rickroll's theme. Loaded last so it can sit on top of the app
     shell, and scoped entirely under .gotcha* so it styles nothing unless
     web/js/gotcha.js has actually mounted the overlay. Delete this line
     with the two files it belongs to. -->
<link rel="stylesheet" href="css/gotcha.css">
<!-- Belt-and-braces: [hidden] is already display:none per the HTML spec
     and is redeclared with !important in base.css -- this inline rule is
     the last-resort fallback if neither stylesheet loads. -->
<style>[hidden]{display:none}</style>
</head>
<body>
<!-- APP SHELL, docs/DESIGN_SYSTEM.md sections 3-4 ("the shell") and 8
     ("landmarks"): a skip link first, then the labelled desktop rail
     (228px, ABSOLUTE inside this wrapper, never fixed to the viewport),
     the top strip, the news banner, the routed view, and the footer.
     Below 900px the rail is replaced by the fixed bottom tab bar at the
     end of this file.

     There is deliberately NO invite-token bar in the chrome: token entry
     lives on the interim #/signin route (web/js/signin.js), so an
     unauthenticated reader meets one customer-language screen instead of
     a credential form bolted to every page. -->
<!-- CHR-9: href="#main-content" is a hash change, and the hash router
     (main.js's parseHash) treats any unknown hash as the default route,
     so an unhandled click re-routed the visitor to Today from wherever
     they actually were. main.js's boot() wires a click handler on this
     link (data-hook below) that prevents the hash navigation and
     focuses #main-content directly instead -- kept in the module, not
     an inline attribute here, per test_web_structure.py's
     no-inline-event-handler rule. The href stays so the link still
     degrades to a plain same-page anchor jump if JS never boots. -->
<a class="skip-link" data-hook="skip-link" href="#main-content">Skip to content</a>
<div class="shell">
  <nav class="rail" aria-label="MLB sections" data-hook="primary-nav"></nav>

  <div class="shell__column">
    <header class="topstrip" data-hook="topstrip">
      <a class="topstrip__home" href="landing.html" aria-label="LINEHOUND home">
        <span class="hound" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="topstrip__wordmark" data-hook="product-name">LINEHOUND</span>
      </a>
      <span class="topstrip__rule" aria-hidden="true"></span>
      <!-- ONE host: web/js/sport.js's renderSportLevel(host, activeSport,
           {placement, linkPrefix}) builds a single <nav aria-label="Sports">
           containing the live sport tabs, its own spacer and the two red
           coming-soon links together (desktop strip items 3-5,
           docs/DESIGN_SYSTEM.md section 3) and mounts the whole thing here
           in one call -- never two separate hosts. CSS repositions this
           same host between the desktop strip and the phone sport row
           (section 3's "single renderSportLevel mount, not two"). -->
      <div data-hook="sport-level-host"></div>
      <span class="topstrip__rule topstrip__rule--wide" aria-hidden="true"></span>
      <time class="topstrip__clock" data-hook="shell-clock"></time>
    </header>

    <!-- News banner (web/js/news.js), directly under the strip on
         desktop and under the sport row on phone (docs/DESIGN_SYSTEM.md
         section 3). Mounted by main.js on every route change. -->
    <div class="news-host" data-hook="news-host"></div>

    <main class="outlet" data-hook="app-outlet" aria-label="page content" id="main-content" tabindex="-1"></main>

    <div class="footer-host" data-hook="disclaimer-host" aria-label="disclaimer"></div>
  </div>

  <nav class="tabbar" aria-label="MLB sections" data-hook="primary-nav-mobile"></nav>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
