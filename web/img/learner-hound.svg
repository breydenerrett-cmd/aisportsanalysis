<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">The Learner: a hound head in a graduation cap</title>
  <rect width="128" height="128" fill="#0E1013"/>
  <!-- ears -->
  <path d="M30 56 L18 96 L44 88 Z" fill="#8A919E"/>
  <path d="M98 56 L110 96 L84 88 Z" fill="#8A919E"/>
  <!-- head -->
  <path d="M34 54 Q64 40 94 54 L90 92 Q64 112 38 92 Z" fill="#D6DBE4"/>
  <!-- muzzle and nose -->
  <path d="M48 80 Q64 72 80 80 L76 98 Q64 106 52 98 Z" fill="#F2F4F8"/>
  <ellipse cx="64" cy="82" rx="7" ry="5" fill="#0B0C0E"/>
  <!-- eyes -->
  <circle cx="50" cy="68" r="4.5" fill="#0B0C0E"/>
  <circle cx="78" cy="68" r="4.5" fill="#0B0C0E"/>
  <circle cx="51.5" cy="66.5" r="1.4" fill="#F6F7FA"/>
  <circle cx="79.5" cy="66.5" r="1.4" fill="#F6F7FA"/>
  <!-- graduation cap -->
  <path d="M64 24 L104 40 L64 56 L24 40 Z" fill="#2FD07A"/>
  <path d="M44 48 L44 58 Q64 66 84 58 L84 48 L64 56 Z" fill="#17A863"/>
  <!-- tassel -->
  <path d="M104 40 L104 62" stroke="#00E0FF" stroke-width="3" fill="none"/>
  <circle cx="104" cy="65" r="4" fill="#00E0FF"/>
  <!-- spark -->
  <path d="M110 14 L112.5 21 L120 23.5 L112.5 26 L110 33 L107.5 26 L100 23.5 L107.5 21 Z" fill="#00E0FF"/>
