# deploy/fly.staging.toml -- Fly.io app config for the temporary alpha
# staging deploy (deploy/STAGING.md). Ready to use as-is except the one
# placeholder below; nothing here requires an account or token to write,
# only to apply (`fly deploy --config deploy/fly.staging.toml`).
#
# WHY THIS FILE EXISTS SEPARATELY FROM WHAT `fly launch` GENERATES
# --------------------------------------------------------------------
# `fly launch --dockerfile deploy/Dockerfile --no-deploy` (deploy/STAGING.md's
# first command) writes a fly.toml with the app skeleton but NOT the
# [mounts] block -- that has to be added by hand or the persistent volume
# exists and is never attached (deploy/STAGING.md's "persistent-volume
# requirement" section explains the failure mode). Checking a complete
# file into the repo means that step is never missed and never redone by
# hand a second time on the next fresh checkout.
#
# app name: working brand per Brey's 2026-09-01 decision (LINEHOUND
# anywhere a temporary customer-facing brand is needed -- still editable.
# Fly app names are globally unique, so "linehound-staging" may already be
# taken -- append Brey's own suffix (e.g. "linehound-staging-2") if so.
app = "linehound-staging"
primary_region = "iad"  # US East -- change to whatever region the volume
                         # below is created in; they must match.

[build]
  dockerfile = "Dockerfile"  # relative to this config file's directory

# Non-secret runtime config. APP_ADMIN_TOKEN and STRIPE_* are secrets --
# they go through `fly secrets set` (deploy/DEPLOY_RUNBOOK.md), never here,
# since fly.toml is a file this repo tracks in git.
[env]
  APP_DB_PATH = "/app/data/app/app.db"
  # Origin Stripe hosted Checkout redirects the browser back to
  # (src/appstate/billing.py's _public_base_url). Non-secret -- it is the
  # public hostname of this very app -- so it belongs here rather than in
  # `fly secrets`. Must match the deployed hostname exactly, or a paying
  # user lands on a dead origin and never reaches their activation token.
  PUBLIC_BASE_URL = "https://linehound-staging.fly.dev"
  # HOSTED DEMO (owner directive 2026-09-07): the read-only game surface and
  # Bet Check are served without an invite token so the staging URL can be
  # opened and shown to anyone. Personal routes (saved bets, digest, admin,
  # billing) stay gated. Remove this line (or set "0") to restore the
  # private-alpha token wall -- see api/app.py PUBLIC_DEMO. Not a secret.
  APP_PUBLIC_DEMO = "1"
  # BILLING_PROVIDER left unset: src/appstate/billing.py's own default
  # (NullBillingProvider, dev/test-safe) applies until STRIPE_API_KEY is
  # set as a secret -- see docs/LAUNCH_DECISIONS.md Decisions 1-2.

# The one piece of state a machine replacement would otherwise destroy
# (deploy/STAGING.md's "persistent-volume requirement, explicitly").
# `source` must match the name given to `fly volumes create` in
# DEPLOY_RUNBOOK.md; `destination`'s parent directory is what APP_DB_PATH
# above points into.
[mounts]
  source = "app_data"
  destination = "/app/data/app"

# ALPHA SIZING: single small machine, no autoscaling. A five-day alpha
# window with a handful of testers does not need horizontal scale, and
# more than one machine would mean more than one process ever writing the
# sqlite store at APP_DB_PATH -- sqlite is not built for concurrent
# writers across processes, so single-process is a correctness constraint
# here, not just a cost one.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep it warm; alpha testers should not
                                # eat a cold-start on the first request of
                                # the day
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1     # see the sqlite single-writer note above --
                                # this is not a knob to raise casually.

  # Fly's own health check, independent of and in addition to the
  # container HEALTHCHECK in deploy/Dockerfile -- this one gates whether
  # Fly's proxy routes traffic to the machine at all.
  # WHY THESE NUMBERS MOVED, 2026-09-10.
  #
  # They were grace 10s / interval 15s / timeout 5s, and on a single shared
  # CPU that guaranteed flapping. From the container's own log that evening:
  #
  #   GET /card/{date}  status=200  latency_ms=15260.3
  #   GET /health       status=200  latency_ms=2866.6
  #   health[...] ERROR Health check on port 8000 has failed.
  #
  # /health touches no store and does no work. Taking 2.9 seconds means the
  # process was starved, not broken -- one CPU, and a 15-second card build
  # holding it. The check then missed its 5s window, Fly pulled the machine
  # out of rotation, and every visitor got a 503 from an app that was alive
  # and working. That is what the owner saw as pages that "just sit there
  # and spin for many many many minutes".
  #
  # A timeout shorter than the app's own slowest legitimate request is not a
  # health check; it is a guarantee of intermittent outage under exactly the
  # load the service exists to handle.
  #
  # 15s timeout clears the slowest measured build with room. 30s interval
  # means a genuinely dead app is still pulled within about a minute, which
  # is the thing a health check is actually for. 30s grace lets the app
  # finish importing before the first probe -- cold imports on this box are
  # not instant either.
  #
  # THE REAL FIX IS A BIGGER MACHINE and this is not a substitute for it. A
  # 15-second card build on one shared vCPU is the underlying problem; these
  # numbers only stop Fly from turning slowness into a total outage. Sizing
  # costs money and is the owner's call.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "15s"
    path = "/health"

# SIZED UP 2026-09-11 (owner approved), AND THE CONSTRAINT IS CPU, NOT MEMORY.
#
# The old note said to raise this only if /health showed MEMORY pressure. That
# was the wrong thing to watch. Measured against the live 512 MB / 1-shared-CPU
# machine, after the card endpoint had already been fixed from 15s to 212ms:
#
#   three simultaneous visitors (7 requests)  -> every one timed out at 6.5s,
#                                                INCLUDING /health
#   one request at a time, warm               -> /health 2,216ms
#                                                /today  3,210ms
#
# /health reads a few store headers and does no work. Two and a fifth seconds
# for it, with nothing else in flight, is a throttled CPU rather than a busy
# one -- a shared vCPU has a quota, and parsing 39 MB of JSON stores burns
# through it. Memory was never the binding limit: local peak RSS serving the
# same routes is about 157 MB.
#
# So: twice the CPU quota, and the memory doubled alongside it because the
# opportunities payload alone is 1.6 MB and headroom is cheap at this size.
#
# THIS IS A FIRST STEP, NOT A VERDICT. If /health is still measured in seconds
# after this, the next move is cpu_kind = "performance" (a dedicated core, no
# quota) rather than more shared CPUs -- but that costs materially more and
# should be bought on evidence, the same way this was.
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
