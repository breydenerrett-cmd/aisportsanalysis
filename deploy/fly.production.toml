# deploy/fly.production.toml -- Fly.io app config for the eventual
# production deploy. Same shape as deploy/fly.staging.toml deliberately --
# see that file's header for why each block exists; this file's comments
# cover only what differs and why the difference is a boundary, not a
# stylistic choice.
#
# THIS IS NOT WHAT deploy/README.md/STAGING.md's Decision 3 RECOMMENDS
# FOR REAL PRODUCTION
# ------------------------------------------------------------------------
# docs/LAUNCH_DECISIONS.md Decision 3's long-term recommendation is a
# Hetzner-class VM + Cloudflare, once ops control and cost matter more
# than time-to-URL (deploy/STAGING.md explains the tradeoff). This file
# exists so that IF Fly is what Brey actually promotes to for production
# (e.g. staging worked well enough that standing up a separate VM isn't
# worth it yet), the promotion is "change four boundary lines below and
# run DEPLOY_RUNBOOK.md's promotion checklist," not a from-scratch config.
# It is not an endorsement of Fly over the VM path for the long run.
app = "linehound-prod"  # Working brand per Brey's 2026-09-01 decision --
    # still editable; Fly app names are globally unique, so append a
    # suffix (e.g. "linehound-prod-2") if this is taken. BOUNDARY 1: a
    # SEPARATE Fly app from staging's, always -- never the same app with a
    # different config, or a bad production deploy and a bad staging
    # deploy become the same incident.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"  # relative to this config file's directory

[env]
  APP_DB_PATH = "/app/data/app/app.db"

  # BOUNDARY 5, and the one that costs a customer money if it is wrong.
  #
  # Where Stripe returns the browser after hosted Checkout. This file had NO
  # PUBLIC_BASE_URL until 2026-09-10, which meant src/appstate/billing.py
  # fell back to DEFAULT_PUBLIC_BASE_URL = "https://example.invalid": Stripe
  # would take the card and send the customer to a domain that does not
  # exist. That redirect is the ONLY bridge from a payment to the access
  # token it buys -- there is no email sender in this repo -- so the
  # customer would have been charged, landed nowhere, and had no route to
  # the product and no way to ask for one.
  #
  # billing.checkout_delivery_ready now refuses the charge outright in that
  # state and GET /health reports it, so the failure can no longer reach a
  # customer. This line is what makes production able to sell at all.
  #
  # Set to the Fly-assigned hostname, which is real the moment this app is
  # deployed. WHEN A CUSTOM DOMAIN IS BOUGHT AND ITS DNS/TLS IS LIVE, change
  # this line and redeploy -- it is deliberately not a secret, so it lives
  # here in version control where a review can see what it points at.
  PUBLIC_BASE_URL = "https://linehound-prod.fly.dev"

  # APP_PUBLIC_DEMO IS DELIBERATELY ABSENT, and must stay absent.
  # deploy/fly.staging.toml sets it to "1", which makes api/app.py drop the
  # paid dependency from every game surface AND makes web/js/betcheck.js
  # route anonymous visitors to the uncapped endpoint instead of the
  # 3-free-checks one. On staging that is the point. On production it would
  # give the entire paid product away to anyone with the URL and silently
  # disable the paywall we are asking people to cross.
  #
  # BILLING_PROVIDER / STRIPE_API_KEY / STRIPE_WEBHOOK_SECRET /
  # STRIPE_BETA_PRICE_ID: production secrets, set via `fly secrets set`
  # against THIS app only (BOUNDARY 3 below) -- never copied from staging's
  # secrets store, since a staging Stripe key is test-mode and a
  # leaked/rotated production key must never have lived in a place
  # staging's operators could read it. All four are required together:
  # BILLING_PROVIDER defaults to "null", whose create_checkout returns an
  # empty URL, which api/signup.py reads as "waitlist this person" -- so a
  # deploy with a real STRIPE_API_KEY and no BILLING_PROVIDER looks
  # configured and silently waitlists every paying customer.

[mounts]
  source = "app_data_production"  # BOUNDARY 2: a SEPARATE volume from
      # staging's `app_data` -- sharing a volume between two apps is not
      # something Fly supports safely, and would mean a staging deploy
      # could corrupt production's user/token store.
  destination = "/app/data/app"

# Same single-writer sqlite constraint as staging (see
# fly.staging.toml's comment) -- this is a correctness limit on
# APP_DB_PATH, not a sizing choice, and does not change until the app db
# moves off sqlite.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512   # revisit once real production traffic (not alpha
                     # testers) gives an actual load number to size against.

# BOUNDARY 4: deploy only from a tagged release, never a working branch --
# `fly deploy` for THIS app should be run only against a commit tagged
# e.g. `vX.Y.Z` (`git tag` + `git push --tags`), so a production rollback
# is always "redeploy the previous tag," a known-good commit, rather than
# "figure out what HEAD was before." Nothing in this file enforces that
# mechanically (no CI is wired to this app on purpose -- see
# DEPLOY_RUNBOOK.md's promotion checklist); it is a discipline boundary
# until a release pipeline exists to make it a mechanical one.
